# הסניפים שנעקוב אחריהם. מזהי הסניפים (store_id) נלקחו מקובצי Stores
# הרשמיים שכל רשת מפרסמת לפי חוק שקיפות המחירים (נכון ל-11/2026).
# כדי למצוא סניפים נוספים:  superbadash discover --city 7400   (7400 = סמל הלמ"ס של נתניה)
#
# enabled = false  -> הסניף מוגדר אבל לא נמשך.
# confirm = "..."  -> פרט שעוד צריך לאשר מול המציאות.

